<meta charset="UTF-8">
<title>NaviFin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#EEF2EE;
    --surface:#FFFFFF;
    --surface-2:#F7FAF8;
    --ink:#142420;
    --ink-muted:#56655F;
    --ink-faint:#8A968F;
    --border:#DBE3DD;
    --accent:#2F6F5E;
    --accent-strong:#1F5445;
    --accent-soft:#E1EEE8;
    --positive:#3F8C4B;
    --positive-soft:#E4F3E4;
    --negative:#B5473B;
    --negative-soft:#FBEAE7;
    --gold:#B8863B;
    --gold-soft:#F6ECD9;
    --shadow:rgba(20,36,32,0.08);
    --chart-1:#2F6F5E;
    --chart-2:#B8863B;
    --chart-3:#6E5B9E;
    --chart-4:#3E7CB1;
    --chart-5:#C97A4A;
    --chart-6:#9E5B7C;
    --chart-7:#7A8C5B;
    --chart-8:#5B8C8C;
    --radius-s:8px;
    --radius-m:12px;
    --radius-l:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0F1714;
      --surface:#16211D;
      --surface-2:#1B2723;
      --ink:#E9EEEA;
      --ink-muted:#93A39B;
      --ink-faint:#66766D;
      --border:#263630;
      --accent:#57B296;
      --accent-strong:#7ACBB0;
      --accent-soft:#1D362E;
      --positive:#5FBE6C;
      --positive-soft:#1B3220;
      --negative:#E28275;
      --negative-soft:#3A211D;
      --gold:#D9A857;
      --gold-soft:#3A2E17;
      --shadow:rgba(0,0,0,0.4);
      --chart-1:#57B296;
      --chart-2:#D9A857;
      --chart-3:#9683C9;
      --chart-4:#6FA4D6;
      --chart-5:#E0996B;
      --chart-6:#C685A0;
      --chart-7:#A2B77E;
      --chart-8:#7FB0B0;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F1714;
    --surface:#16211D;
    --surface-2:#1B2723;
    --ink:#E9EEEA;
    --ink-muted:#93A39B;
    --ink-faint:#66766D;
    --border:#263630;
    --accent:#57B296;
    --accent-strong:#7ACBB0;
    --accent-soft:#1D362E;
    --positive:#5FBE6C;
    --positive-soft:#1B3220;
    --negative:#E28275;
    --negative-soft:#3A211D;
    --gold:#D9A857;
    --gold-soft:#3A2E17;
    --shadow:rgba(0,0,0,0.4);
    --chart-1:#57B296;
    --chart-2:#D9A857;
    --chart-3:#9683C9;
    --chart-4:#6FA4D6;
    --chart-5:#E0996B;
    --chart-6:#C685A0;
    --chart-7:#A2B77E;
    --chart-8:#7FB0B0;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:"Fraunces", Georgia, "Times New Roman", serif; text-wrap:balance; margin:0; }
  .num{ font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  a{ color:var(--accent); }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent-soft); }

  .app{ display:flex; min-height:100vh; }

  .sidebar{
    width:230px;
    flex:none;
    display:flex;
    flex-direction:column;
    padding:22px 16px;
    border-right:1px solid var(--border);
    background:var(--surface);
    gap:22px;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:0 6px; }
  .brand-mark{ font-size:22px; line-height:1; }
  .brand-name{ font-family:"Fraunces", serif; font-weight:600; font-size:20px; letter-spacing:-0.01em; }
  .nav{ display:flex; flex-direction:column; gap:4px; flex:1; }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:var(--radius-s);
    border:none; background:transparent; color:var(--ink-muted);
    font-size:14.5px; font-weight:500; text-align:left; cursor:pointer;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item:hover{ background:var(--surface-2); color:var(--ink); }
  .nav-item.active{ background:var(--accent-soft); color:var(--accent-strong); }
  .nav-icon{ width:18px; text-align:center; }
  .sidebar-footer{ display:flex; justify-content:space-between; align-items:center; padding:0 6px; }
  .storage-note{ font-size:11.5px; color:var(--ink-faint); line-height:1.4; }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 32px; border-bottom:1px solid var(--border);
    position:sticky; top:0; background:var(--paper); z-index:5;
  }
  .topbar h1{ font-size:24px; font-weight:600; }
  .view-root{ padding:28px 32px 60px; flex:1; }

  .btn-primary, .btn-secondary, .btn-ghost, .btn-danger{
    display:inline-flex; align-items:center; gap:8px;
    border-radius:var(--radius-s); border:1px solid transparent;
    padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer;
    transition:transform .08s ease, background .12s ease, border-color .12s ease;
  }
  .btn-primary{ background:var(--accent); color:#F4FBF8; }
  .btn-primary:hover{ background:var(--accent-strong); }
  .btn-secondary{ background:var(--surface); color:var(--ink); border-color:var(--border); }
  .btn-secondary:hover{ background:var(--surface-2); }
  .btn-ghost{ background:transparent; color:var(--ink-muted); border-color:transparent; padding:8px 10px; }
  .btn-ghost:hover{ background:var(--surface-2); color:var(--ink); }
  .btn-danger{ background:var(--negative-soft); color:var(--negative); border-color:transparent; }
  .btn-danger:hover{ filter:brightness(0.96); }
  .btn-primary:active, .btn-secondary:active{ transform:translateY(1px); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .icon-btn{
    width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center;
    border-radius:var(--radius-s); border:1px solid var(--border); background:var(--surface);
    color:var(--ink-muted); cursor:pointer; font-size:14px;
  }
  .icon-btn:hover{ color:var(--ink); background:var(--surface-2); }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l);
    padding:22px; box-shadow:0 1px 2px var(--shadow);
  }
  .card-title{ font-size:13px; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:14px; }

  .grid{ display:grid; gap:18px; }
  .dash-grid{ grid-template-columns:1.4fr 1fr; }
  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  @media (max-width:1000px){ .dash-grid{ grid-template-columns:1fr; } .stat-row{ grid-template-columns:repeat(2,1fr); } }

  .hero{ display:flex; flex-direction:column; gap:18px; }
  .hero-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .hero-label{ font-size:13px; color:var(--ink-muted); font-weight:500; }
  .hero-balance{ font-family:"Fraunces", serif; font-size:46px; font-weight:600; letter-spacing:-0.02em; line-height:1.05; margin-top:4px; }
  .hero-delta{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; margin-top:8px; padding:4px 9px; border-radius:20px; }
  .hero-delta.pos{ color:var(--positive); background:var(--positive-soft); }
  .hero-delta.neg{ color:var(--negative); background:var(--negative-soft); }

  .stat{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:16px 18px; }
  .stat-label{ font-size:12px; color:var(--ink-muted); font-weight:500; }
  .stat-value{ font-family:"IBM Plex Mono"; font-size:21px; font-weight:600; margin-top:6px; font-variant-numeric:tabular-nums; }
  .stat-value.pos{ color:var(--positive); }
  .stat-value.neg{ color:var(--negative); }
  .stat-value.gold{ color:var(--gold); }

  .list-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); }
  .list-row:last-child{ border-bottom:none; }
  .tx-main{ display:flex; align-items:center; gap:10px; min-width:0; }
  .tx-dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .tx-text{ min-width:0; }
  .tx-cat{ font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tx-meta{ font-size:12px; color:var(--ink-faint); margin-top:2px; }
  .tx-amount{ font-family:"IBM Plex Mono"; font-weight:600; font-size:14px; white-space:nowrap; }
  .tx-amount.income{ color:var(--positive); }
  .tx-amount.expense{ color:var(--ink); }

  .pill{ display:inline-flex; align-items:center; padding:2px 9px; border-radius:20px; font-size:11.5px; font-weight:600; letter-spacing:.01em; border:1px solid transparent; }
  .pill.estimated{ background:var(--surface-2); color:var(--ink-faint); border-color:var(--border); }

  .bars{ display:flex; flex-direction:column; gap:11px; }
  .bar-row{ display:grid; grid-template-columns:120px 1fr 78px; align-items:center; gap:10px; }
  .bar-label{ font-size:13px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track{ height:9px; border-radius:5px; background:var(--surface-2); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:5px; }
  .bar-value{ font-family:"IBM Plex Mono"; font-size:12.5px; text-align:right; color:var(--ink-muted); }

  .toolbar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:18px; }
  .field-select, .field-input{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-s);
    padding:8px 12px; font-size:13.5px; color:var(--ink); font-family:inherit;
  }
  .field-input{ min-width:200px; }

  table{ width:100%; border-collapse:collapse; }
  .table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-m); }
  thead th{
    text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink-muted); font-weight:600; padding:11px 14px; background:var(--surface-2);
    border-bottom:1px solid var(--border); white-space:nowrap;
  }
  tbody td{ padding:11px 14px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface-2); }
  td.amount{ font-family:"IBM Plex Mono"; font-weight:600; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  td.amount.income{ color:var(--positive); }
  td.amount.expense{ color:var(--ink); }
  td.actions{ text-align:right; white-space:nowrap; }
  .row-actions{ display:inline-flex; gap:6px; }
  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-muted); }

  .segmented{ display:inline-flex; border:1px solid var(--border); border-radius:var(--radius-s); overflow:hidden; }
  .segmented button{ border:none; background:var(--surface); color:var(--ink-muted); padding:8px 16px; font-size:13.5px; font-weight:600; cursor:pointer; }
  .segmented button + button{ border-left:1px solid var(--border); }
  .segmented button.active{ background:var(--accent); color:#F4FBF8; }

  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field.full{ grid-column:1/-1; }
  .field label{ font-size:12.5px; font-weight:600; color:var(--ink-muted); }
  .field input, .field select, .field textarea{
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-s);
    padding:9px 11px; font-size:14px; color:var(--ink); font-family:inherit;
  }
  .field textarea{ resize:vertical; min-height:60px; }
  .field input:focus, .field select:focus, .field textarea:focus{ background:var(--surface); }
  datalist{ }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,18,15,0.45); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:var(--surface); border-radius:var(--radius-l); border:1px solid var(--border);
    width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
    padding:26px; box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }
  .modal h2{ font-size:20px; margin-bottom:18px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .modal.small{ max-width:400px; }
  .modal p{ color:var(--ink-muted); font-size:14px; line-height:1.55; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:11px 20px; border-radius:24px;
    font-size:13.5px; font-weight:500; z-index:60; box-shadow:0 8px 24px rgba(0,0,0,0.25);
    opacity:0; transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .goal-row{ display:grid; grid-template-columns:1fr auto auto; gap:12px; align-items:center; padding:13px 0; border-bottom:1px solid var(--border); }
  .goal-row:last-child{ border-bottom:none; }
  .goal-name{ font-weight:600; font-size:14.5px; }
  .goal-amount{ font-family:"IBM Plex Mono"; font-weight:600; color:var(--gold); }

  .ledger-calc{ display:flex; flex-direction:column; gap:10px; }
  .ledger-line{ display:flex; justify-content:space-between; font-size:14.5px; padding:6px 0; }
  .ledger-line.total{ border-top:1px dashed var(--border); padding-top:12px; font-weight:700; font-size:16px; }
  .ledger-line .num{ font-weight:600; }

  .chart-wrap{ width:100%; }
  .chart-wrap svg{ width:100%; height:auto; display:block; }
  .axis-label{ font-size:10.5px; fill:var(--ink-faint); font-family:"IBM Plex Mono", monospace; }
  .legend{ display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--ink-muted); }
  .legend-item{ display:flex; align-items:center; gap:6px; }
  .legend-dot{ width:9px; height:9px; border-radius:2px; }

  .prose{ color:var(--ink-muted); font-size:14px; line-height:1.6; max-width:620px; }
  .code-block{
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-m);
    padding:14px; font-family:"IBM Plex Mono"; font-size:12px; width:100%; min-height:160px;
    color:var(--ink); resize:vertical;
  }
  .danger-zone{ border-color:var(--negative-soft); }
  .section-gap{ display:flex; flex-direction:column; gap:22px; }

  .mobile-topbar{ display:none; }

  @media (max-width:860px){
    .app{ flex-direction:column; }
    .sidebar{
      width:100%; flex-direction:row; align-items:center; border-right:none;
      border-top:1px solid var(--border); order:2; position:fixed; bottom:0; left:0; right:0;
      padding:8px 10px; z-index:20; justify-content:space-around; gap:0;
    }
    .brand, .sidebar-footer .storage-note{ display:none; }
    .sidebar-footer{ padding:0; }
    .nav{ flex-direction:row; flex:1; justify-content:space-around; }
    .nav-item{ flex-direction:column; font-size:10.5px; padding:6px 8px; gap:3px; }
    .mobile-topbar{
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 18px; border-bottom:1px solid var(--border); background:var(--surface);
    }
    .main{ padding-bottom:64px; }
    .topbar{ padding:16px 18px; }
    .view-root{ padding:18px 16px 40px; }
    .form-grid{ grid-template-columns:1fr; }
    .stat-row{ grid-template-columns:1fr 1fr; }
    .bar-row{ grid-template-columns:84px 1fr 62px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">💶</span>
      <span class="brand-name">NaviFin</span>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item" data-view="dashboard"><span class="nav-icon">◆</span><span>Übersicht</span></button>
      <button class="nav-item" data-view="transactions"><span class="nav-icon">≡</span><span>Buchungen</span></button>
      <button class="nav-item" data-view="goals"><span class="nav-icon">◎</span><span>Rücklagen</span></button>
      <button class="nav-item" data-view="sections"><span class="nav-icon">▦</span><span>Bereiche</span></button>
      <button class="nav-item" data-view="analysis"><span class="nav-icon">▤</span><span>Auswertung</span></button>
      <button class="nav-item" data-view="data"><span class="nav-icon">⇄</span><span>Daten</span></button>
    </nav>
    <div class="sidebar-footer">
      <span class="storage-note">Daten lokal<br>in diesem Browser</span>
      <button class="icon-btn" id="theme-toggle" title="Design wechseln" aria-label="Design wechseln">◐</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <h1 id="view-title">Übersicht</h1>
      <button class="btn-primary" id="add-tx-btn">+ Neue Buchung</button>
    </header>
    <div id="view-root" class="view-root"></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast-root" class="toast"></div>

<script>
(function(){
  "use strict";

  var SEED = {
    "openingBalance": { "amount": 0, "date": todayIso() },
    "transactions": [],
    "goals": [],
    "sections": ["Finanztransaktionen", "Vermögen & Vorsorge", "Lebenshaltung"],
    "categories": { "Finanztransaktionen": [], "Vermögen & Vorsorge": [], "Lebenshaltung": [] }
  };

  var STORAGE_KEY = "finanzpilot.state.v1";
  var DEFAULT_SECTIONS = ["Finanztransaktionen", "Vermögen & Vorsorge", "Lebenshaltung"];
  var MONTH_LABELS = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];

  function uid(prefix){
    var rnd = (window.crypto && crypto.randomUUID) ? crypto.randomUUID().slice(0,8) : Math.random().toString(36).slice(2,10);
    return prefix + "_" + rnd;
  }
  function clone(obj){
    return window.structuredClone ? structuredClone(obj) : JSON.parse(JSON.stringify(obj));
  }
  function escapeHtml(str){
    return String(str == null ? "" : str).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function fmtEUR(n){
    return new Intl.NumberFormat("de-DE", { style:"currency", currency:"EUR" }).format(n || 0);
  }
  function fmtEURSigned(n){
    var s = fmtEUR(Math.abs(n));
    return (n < 0 ? "−" : "+") + s;
  }
  function fmtDate(iso){
    if (!iso) return "";
    var d = new Date(iso + "T00:00:00");
    return new Intl.DateTimeFormat("de-DE", { day:"2-digit", month:"2-digit", year:"numeric" }).format(d);
  }
  function fmtDateShort(iso){
    if (!iso) return "";
    var d = new Date(iso + "T00:00:00");
    return new Intl.DateTimeFormat("de-DE", { day:"2-digit", month:"2-digit" }).format(d);
  }
  function bucketLabel(bucket){
    var parts = bucket.split("-");
    var idx = parseInt(parts[1], 10) - 1;
    return MONTH_LABELS[idx] + " " + parts[0];
  }
  function todayIso(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function loadState(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw){
        var parsed = JSON.parse(raw);
        if (parsed && parsed.transactions && parsed.openingBalance && parsed.goals){
          if (!parsed.sections) parsed.sections = DEFAULT_SECTIONS.slice();
          if (!parsed.categories) parsed.categories = {};
          return parsed;
        }
      }
    } catch(e){}
    return clone(SEED);
  }
  function saveState(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){
      showToast("Speichern fehlgeschlagen – Browser-Speicher evtl. voll.");
    }
  }

  var state = loadState();
  var ui = {
    view: "dashboard",
    editingTxId: null,
    filters: { bucket: "all", section: "all", type: "all", search: "" },
    analysis: { scope: "all", type: "expense" },
  };

  var categoryColorCache = new Map();
  function categoryColor(name){
    if (categoryColorCache.has(name)) return categoryColorCache.get(name);
    var idx = (categoryColorCache.size % 8) + 1;
    var v = "var(--chart-" + idx + ")";
    categoryColorCache.set(name, v);
    return v;
  }
  var sectionColorCache = new Map();
  function sectionColor(name){
    if (sectionColorCache.has(name)) return sectionColorCache.get(name);
    var idx = (sectionColorCache.size % 8) + 1;
    var v = "var(--chart-" + idx + ")";
    sectionColorCache.set(name, v);
    return v;
  }
  function sectionPill(name){
    var c = sectionColor(name);
    return '<span class="pill" style="background:color-mix(in srgb, ' + c + ' 16%, transparent);color:' + c + ';border-color:color-mix(in srgb, ' + c + ' 35%, transparent);">' + escapeHtml(name) + "</span>";
  }

  function txSigned(t){ return t.type === "income" ? t.amount : -t.amount; }
  function currentBalance(){
    return state.openingBalance.amount + state.transactions.reduce(function(s,t){ return s + txSigned(t); }, 0);
  }
  function totalReserved(){
    return state.goals.reduce(function(s,g){ return s + g.target; }, 0);
  }
  function freeBalance(){ return currentBalance() - totalReserved(); }

  function monthlyBuckets(){
    var map = new Map();
    state.transactions.forEach(function(t){
      if (!map.has(t.bucket)) map.set(t.bucket, { bucket:t.bucket, income:0, expense:0 });
      var b = map.get(t.bucket);
      if (t.type === "income") b.income += t.amount; else b.expense += t.amount;
    });
    var arr = Array.from(map.values());
    arr.sort(function(a,b){ return a.bucket < b.bucket ? -1 : 1; });
    var bal = state.openingBalance.amount;
    arr.forEach(function(b){
      b.net = b.income - b.expense;
      bal += b.net;
      b.balance = bal;
    });
    return arr;
  }

  function sortedTransactions(){
    var arr = state.transactions.slice();
    arr.sort(function(a,b){
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return a.id < b.id ? 1 : -1;
    });
    return arr;
  }

  function filteredTransactions(){
    var f = ui.filters;
    var q = f.search.trim().toLowerCase();
    return sortedTransactions().filter(function(t){
      if (f.bucket !== "all" && t.bucket !== f.bucket) return false;
      if (f.section !== "all" && t.section !== f.section) return false;
      if (f.type !== "all" && t.type !== f.type) return false;
      if (q && t.category.toLowerCase().indexOf(q) === -1 && (t.note||"").toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  function categoryBreakdown(scope, type){
    var map = new Map();
    state.transactions.forEach(function(t){
      if (t.type !== type) return;
      if (scope !== "all" && t.bucket !== scope) return;
      map.set(t.category, (map.get(t.category) || 0) + t.amount);
    });
    var arr = Array.from(map, function(e){ return { name:e[0], amount:e[1] }; });
    arr.sort(function(a,b){ return b.amount - a.amount; });
    return arr;
  }

  function el(html){
    var d = document.createElement("div");
    d.innerHTML = html.trim();
    return d.firstElementChild;
  }

  var toastTimer = null;
  function showToast(msg){
    var t = document.getElementById("toast-root");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2400);
  }

  /* ---------- Modal ---------- */
  function openModal(innerHtml, opts){
    opts = opts || {};
    closeModal();
    var backdrop = el('<div class="modal-backdrop"><div class="modal ' + (opts.small ? "small" : "") + '" role="dialog" aria-modal="true">' + innerHtml + "</div></div>");
    backdrop.addEventListener("mousedown", function(e){ if (e.target === backdrop) closeModal(); });
    document.getElementById("modal-root").appendChild(backdrop);
    document.addEventListener("keydown", modalEscHandler);
    var firstInput = backdrop.querySelector("input, select, textarea, button");
    if (firstInput) firstInput.focus();
    return backdrop;
  }
  function modalEscHandler(e){ if (e.key === "Escape") closeModal(); }
  function closeModal(){
    var root = document.getElementById("modal-root");
    root.innerHTML = "";
    document.removeEventListener("keydown", modalEscHandler);
  }

  function confirmModal(opts){
    var modal = openModal(
      "<h2>" + escapeHtml(opts.title) + "</h2>" +
      "<p>" + escapeHtml(opts.message) + "</p>" +
      '<div class="modal-actions">' +
        '<button class="btn-secondary" data-close>Abbrechen</button>' +
        '<button class="' + (opts.danger ? "btn-danger" : "btn-primary") + '" data-confirm>' + escapeHtml(opts.confirmLabel || "Bestätigen") + "</button>" +
      "</div>",
      { small:true }
    );
    modal.querySelector("[data-close]").addEventListener("click", closeModal);
    modal.querySelector("[data-confirm]").addEventListener("click", function(){
      closeModal();
      opts.onConfirm();
    });
  }

  /* ---------- Transaction form ---------- */
  function openTxForm(txId){
    if (state.sections.length === 0){
      showToast("Bitte lege zuerst einen Bereich an (Tab „Bereiche“).");
      return;
    }
    var editing = txId ? state.transactions.find(function(t){ return t.id === txId; }) : null;
    var draft = editing ? Object.assign({}, editing) : {
      id:null, date: todayIso(), section: state.sections[0], category:"", type:"expense", method:"konto", amount:"", note:""
    };

    var sectionOptions = state.sections.map(function(s){
      return '<option value="' + escapeHtml(s) + '"' + (s === draft.section ? " selected" : "") + ">" + escapeHtml(s) + "</option>";
    }).join("");

    var html =
      "<h2>" + (editing ? "Buchung bearbeiten" : "Neue Buchung") + "</h2>" +
      '<form id="tx-form">' +
        '<div class="form-grid">' +
          '<div class="field"><label for="f-date">Datum</label><input type="date" id="f-date" value="' + draft.date + '" required></div>' +
          '<div class="field"><label for="f-section">Bereich</label><select id="f-section">' + sectionOptions + "</select></div>" +
          '<div class="field full"><label for="f-category">Verwendungszweck</label>' +
            '<input type="text" id="f-category" list="category-suggestions" value="' + escapeHtml(draft.category) + '" placeholder="z. B. Lebensmittel" required>' +
            '<datalist id="category-suggestions"></datalist>' +
          "</div>" +
          '<div class="field"><label>Typ</label><div class="segmented" id="f-type">' +
            '<button type="button" data-value="income" class="' + (draft.type === "income" ? "active" : "") + '">Einnahme</button>' +
            '<button type="button" data-value="expense" class="' + (draft.type === "expense" ? "active" : "") + '">Ausgabe</button>' +
          "</div></div>" +
          '<div class="field"><label>Methode</label><div class="segmented" id="f-method">' +
            '<button type="button" data-value="konto" class="' + (draft.method === "konto" ? "active" : "") + '">Konto</button>' +
            '<button type="button" data-value="bar" class="' + (draft.method === "bar" ? "active" : "") + '">Bar</button>' +
          "</div></div>" +
          '<div class="field"><label for="f-amount">Betrag (€)</label><input type="number" id="f-amount" inputmode="decimal" step="0.01" min="0.01" value="' + (draft.amount === "" ? "" : draft.amount) + '" required></div>' +
          '<div class="field full"><label for="f-note">Notiz (optional)</label><textarea id="f-note">' + escapeHtml(draft.note) + "</textarea></div>" +
        "</div>" +
        '<div class="modal-actions">' +
          (editing ? '<button type="button" class="btn-danger" id="f-delete" style="margin-right:auto;">Löschen</button>' : "") +
          '<button type="button" class="btn-secondary" data-close>Abbrechen</button>' +
          '<button type="submit" class="btn-primary">Speichern</button>' +
        "</div>" +
      "</form>";

    var modal = openModal(html);
    var typeVal = draft.type, methodVal = draft.method, sectionVal = draft.section;

    function updateCategorySuggestions(){
      var list = state.categories[sectionVal] || [];
      modal.querySelector("#category-suggestions").innerHTML = list.map(function(c){
        return '<option value="' + escapeHtml(c) + '">';
      }).join("");
    }
    updateCategorySuggestions();

    modal.querySelector("#f-section").addEventListener("change", function(e){
      sectionVal = e.target.value;
      updateCategorySuggestions();
    });
    modal.querySelectorAll("#f-type button").forEach(function(btn){
      btn.addEventListener("click", function(){
        typeVal = btn.dataset.value;
        modal.querySelectorAll("#f-type button").forEach(function(b){ b.classList.toggle("active", b === btn); });
      });
    });
    modal.querySelectorAll("#f-method button").forEach(function(btn){
      btn.addEventListener("click", function(){
        methodVal = btn.dataset.value;
        modal.querySelectorAll("#f-method button").forEach(function(b){ b.classList.toggle("active", b === btn); });
      });
    });
    modal.querySelector("[data-close]").addEventListener("click", closeModal);
    if (editing){
      modal.querySelector("#f-delete").addEventListener("click", function(){
        closeModal();
        confirmModal({
          title: "Buchung löschen?",
          message: "„" + editing.category + "“ über " + fmtEUR(editing.amount) + " wird endgültig entfernt.",
          danger: true,
          confirmLabel: "Löschen",
          onConfirm: function(){
            state.transactions = state.transactions.filter(function(t){ return t.id !== editing.id; });
            saveState();
            render();
            showToast("Buchung gelöscht.");
          }
        });
      });
    }

    modal.querySelector("#tx-form").addEventListener("submit", function(e){
      e.preventDefault();
      var date = modal.querySelector("#f-date").value;
      var category = modal.querySelector("#f-category").value.trim();
      var amount = parseFloat(modal.querySelector("#f-amount").value);
      var note = modal.querySelector("#f-note").value.trim();
      if (!date || !category || !(amount > 0)){
        showToast("Bitte Datum, Verwendungszweck und Betrag prüfen.");
        return;
      }
      var bucket = date.slice(0,7);
      if (!state.categories[sectionVal]) state.categories[sectionVal] = [];
      if (state.categories[sectionVal].indexOf(category) === -1) state.categories[sectionVal].push(category);

      if (editing){
        Object.assign(editing, { date:date, bucket:bucket, section:sectionVal, category:category, type:typeVal, method:methodVal, amount:amount, note:note });
      } else {
        state.transactions.push({ id: uid("t"), date:date, bucket:bucket, dateEstimated:false, section:sectionVal, category:category, type:typeVal, method:methodVal, amount:amount, note:note });
      }
      saveState();
      closeModal();
      render();
      showToast(editing ? "Buchung aktualisiert." : "Buchung hinzugefügt.");
    });
  }

  /* ---------- Charts ---------- */
  function renderSparkline(points){
    var w = 560, h = 160, padL = 20, padR = 20, padT = 14, padB = 22;
    if (points.length === 0) return '<div class="prose">Noch keine Daten für einen Verlauf.</div>';
    var vals = points.map(function(p){ return p.balance; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (min === max){ min -= 1; max += 1; }
    var innerW = w - padL - padR, innerH = h - padT - padB;
    function x(i){ return padL + (points.length === 1 ? innerW/2 : (i/(points.length-1)) * innerW); }
    function y(v){ return padT + innerH - ((v - min)/(max - min)) * innerH; }
    var linePts = points.map(function(p,i){ return x(i) + "," + y(p.balance); }).join(" L ");
    var areaPath = "M " + x(0) + "," + y(points[0].balance) + " L " + linePts + " L " + x(points.length-1) + "," + (padT+innerH) + " L " + x(0) + "," + (padT+innerH) + " Z";
    var linePath = "M " + linePts;
    var last = points[points.length-1];
    var gridLines = "";
    for (var g=0; g<3; g++){
      var gy = padT + (innerH/2)*g;
      gridLines += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (w-padR) + '" y2="' + gy + '" stroke="var(--border)" stroke-width="1" stroke-dasharray="2,4"/>';
    }
    var labels = points.map(function(p,i){
      if (points.length > 8 && i % 2 === 1) return "";
      return '<text class="axis-label" x="' + x(i) + '" y="' + (h-4) + '" text-anchor="middle">' + bucketLabel(p.bucket).split(" ")[0] + "</text>";
    }).join("");
    return '<div class="chart-wrap"><svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="xMidYMid meet">' +
      '<defs><linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="var(--accent)" stop-opacity="0.28"/>' +
        '<stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>' +
      "</linearGradient></defs>" +
      gridLines +
      '<path d="' + areaPath + '" fill="url(#sparkGrad)" stroke="none"/>' +
      '<path d="' + linePath + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + x(points.length-1) + '" cy="' + y(last.balance) + '" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>' +
      labels +
      "</svg></div>";
  }

  function renderMonthlyBarChart(buckets){
    if (buckets.length === 0) return '<div class="prose">Noch keine Buchungen vorhanden.</div>';
    var w = 640, h = 260, padL = 44, padR = 12, padT = 16, padB = 30;
    var innerW = w - padL - padR, innerH = h - padT - padB;
    var maxVal = Math.max.apply(null, buckets.map(function(b){ return Math.max(b.income, b.expense); }), 1);
    var mid = padT + innerH/2;
    var slot = innerW / buckets.length;
    var barW = Math.min(26, slot * 0.42);
    var bars = "", labels = "", grid = "";
    for (var g=0; g<=2; g++){
      var gy = padT + (innerH/2) * g;
      grid += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (w-padR) + '" y2="' + gy + '" stroke="var(--border)" stroke-width="1" stroke-dasharray="2,4"/>';
    }
    buckets.forEach(function(b, i){
      var cx = padL + slot*i + slot/2;
      var incH = (b.income / maxVal) * (innerH/2);
      var expH = (b.expense / maxVal) * (innerH/2);
      bars += '<rect x="' + (cx - barW - 2) + '" y="' + (mid - incH) + '" width="' + barW + '" height="' + incH + '" rx="2" fill="var(--positive)"><title>' + bucketLabel(b.bucket) + " Einnahmen: " + fmtEUR(b.income) + "</title></rect>";
      bars += '<rect x="' + (cx + 2) + '" y="' + mid + '" width="' + barW + '" height="' + expH + '" rx="2" fill="var(--negative)"><title>' + bucketLabel(b.bucket) + " Ausgaben: " + fmtEUR(b.expense) + "</title></rect>";
      labels += '<text class="axis-label" x="' + cx + '" y="' + (h-8) + '" text-anchor="middle">' + bucketLabel(b.bucket).split(" ")[0] + "</text>";
    });
    return '<div class="chart-wrap"><svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="xMidYMid meet">' +
      grid +
      '<line x1="' + padL + '" y1="' + mid + '" x2="' + (w-padR) + '" y2="' + mid + '" stroke="var(--ink-faint)" stroke-width="1"/>' +
      bars + labels +
      "</svg></div>" +
      '<div class="legend"><span class="legend-item"><span class="legend-dot" style="background:var(--positive)"></span>Einnahmen</span><span class="legend-item"><span class="legend-dot" style="background:var(--negative)"></span>Ausgaben</span></div>';
  }

  function renderBarsList(items, total){
    if (items.length === 0) return '<div class="empty-state">Keine Buchungen in diesem Zeitraum.</div>';
    var max = items[0].amount || 1;
    return '<div class="bars">' + items.slice(0,10).map(function(it){
      var pct = Math.max(4, (it.amount / max) * 100);
      return '<div class="bar-row">' +
        '<div class="bar-label" title="' + escapeHtml(it.name) + '">' + escapeHtml(it.name) + "</div>" +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + "%;background:" + categoryColor(it.name) + ';"></div></div>' +
        '<div class="bar-value num">' + fmtEUR(it.amount) + "</div>" +
      "</div>";
    }).join("") + "</div>";
  }

  /* ---------- Views ---------- */
  function renderDashboard(){
    var balance = currentBalance();
    var buckets = monthlyBuckets();
    var thisBucket = todayIso().slice(0,7);
    var thisMonth = buckets.find(function(b){ return b.bucket === thisBucket; }) || { income:0, expense:0, net:0 };
    var prevIdx = buckets.findIndex(function(b){ return b.bucket === thisBucket; }) - 1;
    var prevBalance = prevIdx >= 0 ? buckets[prevIdx].balance : state.openingBalance.amount;
    var delta = balance - prevBalance;
    var reserved = totalReserved();
    var free = balance - reserved;
    var recent = sortedTransactions().slice(0, 6);
    var catItems = categoryBreakdown(thisBucket, "expense");

    document.getElementById("view-root").innerHTML =
      '<div class="grid dash-grid">' +
        '<div class="card hero">' +
          '<div class="hero-top">' +
            '<div><div class="hero-label">Aktueller Kontostand</div><div class="hero-balance num">' + fmtEUR(balance) + "</div>" +
            '<span class="hero-delta ' + (delta >= 0 ? "pos" : "neg") + '">' + (delta >= 0 ? "▲" : "▼") + " " + fmtEURSigned(delta) + " seit letztem Monat</span>" +
            "</div>" +
          "</div>" +
          renderSparkline(buckets) +
        "</div>" +
        '<div class="card">' +
          '<div class="card-title">Letzte Buchungen</div>' +
          (recent.length === 0 ? '<div class="empty-state">Noch keine Buchungen.</div>' : recent.map(txListRow).join("")) +
        "</div>" +
      "</div>" +
      '<div class="grid stat-row" style="margin-top:18px;">' +
        '<div class="stat"><div class="stat-label">Frei verfügbar</div><div class="stat-value ' + (free < 0 ? "neg" : "") + ' num">' + fmtEUR(free) + "</div></div>" +
        '<div class="stat"><div class="stat-label">Rücklagen gesamt</div><div class="stat-value gold num">' + fmtEUR(reserved) + "</div></div>" +
        '<div class="stat"><div class="stat-label">Einnahmen · ' + bucketLabel(thisBucket) + '</div><div class="stat-value pos num">' + fmtEUR(thisMonth.income) + "</div></div>" +
        '<div class="stat"><div class="stat-label">Ausgaben · ' + bucketLabel(thisBucket) + '</div><div class="stat-value neg num">' + fmtEUR(thisMonth.expense) + "</div></div>" +
      "</div>" +
      '<div class="grid dash-grid" style="margin-top:18px;">' +
        '<div class="card">' +
          '<div class="card-title">Ausgaben nach Kategorie · ' + bucketLabel(thisBucket) + "</div>" +
          renderBarsList(catItems) +
        "</div>" +
        '<div class="card">' +
          '<div class="card-title">Rücklagen</div>' +
          (state.goals.length === 0 ? '<div class="empty-state">Keine Rücklagen angelegt.</div>' : state.goals.map(function(g){
            return '<div class="list-row"><div class="tx-text"><div class="tx-cat">' + escapeHtml(g.name) + '</div></div><div class="tx-amount">' + fmtEUR(g.target) + "</div></div>";
          }).join("")) +
        "</div>" +
      "</div>";
  }

        '<span class="tx-dot" style="background:' + (t.type === "income" ? "var(--positive)" : categoryColor(t.category)) + '"></span>' +
        '<div class="tx-text"><div class="tx-cat">' + escapeHtml(t.category) + '</div><div class="tx-meta">' + fmtDateShort(t.date) + " · " + t.section + "</div></div>" +

      '<div class="tx-amount ' + (t.type === "income" ? "income" : "expense") + ' num">' + (t.type === "income" ? "+" : "−") + fmtEUR(t.amount).replace("-","") + "</div>" +

  function renderGoals(){
    var balance = currentBalance();
    var reserved = totalReserved();
    var free = balance - reserved;

    document.getElementById("view-root").innerHTML =
      '<div class="grid dash-grid">' +
        '<div class="card">' +
          '<div class="card-title">Rücklagen</div>' +
          (state.goals.length === 0 ? '<div class="empty-state">Noch keine Rücklagen angelegt.</div>' : state.goals.map(function(g){
            return '<div class="goal-row">' +
              '<div class="goal-name">' + escapeHtml(g.name) + "</div>" +
              '<div class="goal-amount num">' + fmtEUR(g.target) + "</div>" +
              '<div class="row-actions">' +
                '<button class="icon-btn" data-action="edit-goal" data-id="' + g.id + '" title="Bearbeiten">✎</button>' +
                '<button class="icon-btn" data-action="delete-goal" data-id="' + g.id + '" title="Löschen">✕</button>' +
              "</div>" +
            "</div>";
          }).join("")) +
          '<div style="margin-top:16px;"><button class="btn-secondary" id="add-goal-btn">+ Rücklage hinzufügen</button></div>' +
        "</div>" +
        '<div class="card">' +
          '<div class="card-title">Rechnung</div>' +
          '<div class="ledger-calc">' +
            '<div class="ledger-line"><span>Kontostand</span><span class="num">' + fmtEUR(balance) + "</span></div>" +
            '<div class="ledger-line"><span>− Rücklagen gesamt</span><span class="num">' + fmtEUR(reserved) + "</span></div>" +
            '<div class="ledger-line total"><span>= Frei verfügbar</span><span class="num ' + (free < 0 ? "neg" : "pos") + '">' + fmtEUR(free) + "</span></div>" +
          "</div>" +
          '<p class="prose" style="margin-top:16px;">Rücklagen sind Beträge, die du gedanklich für bestimmte Zwecke zurückgelegt hast – sie werden vom Kontostand abgezogen, damit du siehst, was wirklich frei verfügbar ist.</p>' +
        "</div>" +
      "</div>";

    document.getElementById("add-goal-btn").addEventListener("click", function(){ openGoalForm(null); });
    document.querySelectorAll('[data-action="edit-goal"]').forEach(function(btn){
      btn.addEventListener("click", function(){ openGoalForm(btn.dataset.id); });
    });
    document.querySelectorAll('[data-action="delete-goal"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var g = state.goals.find(function(x){ return x.id === btn.dataset.id; });
        confirmModal({
          title: "Rücklage löschen?",
          message: "„" + g.name + "“ (" + fmtEUR(g.target) + ") wird entfernt.",
          danger: true,
          confirmLabel: "Löschen",
          onConfirm: function(){
            state.goals = state.goals.filter(function(x){ return x.id !== g.id; });
            saveState(); render(); showToast("Rücklage gelöscht.");
          }
        });
      });
    });
  }

  function openGoalForm(goalId){
    var editing = goalId ? state.goals.find(function(g){ return g.id === goalId; }) : null;
    var html = "<h2>" + (editing ? "Rücklage bearbeiten" : "Neue Rücklage") + "</h2>" +
      '<form id="goal-form">' +
        '<div class="form-grid">' +
          '<div class="field full"><label for="g-name">Name</label><input type="text" id="g-name" value="' + (editing ? escapeHtml(editing.name) : "") + '" placeholder="z. B. Urlaub" required></div>' +
          '<div class="field full"><label for="g-target">Betrag (€)</label><input type="number" id="g-target" step="0.01" min="0" value="' + (editing ? editing.target : "") + '" required></div>' +
        "</div>" +
        '<div class="modal-actions"><button type="button" class="btn-secondary" data-close>Abbrechen</button><button type="submit" class="btn-primary">Speichern</button></div>' +
      "</form>";
    var modal = openModal(html, { small:true });
    modal.querySelector("[data-close]").addEventListener("click", closeModal);
    modal.querySelector("#goal-form").addEventListener("submit", function(e){
      e.preventDefault();
      var name = modal.querySelector("#g-name").value.trim();
      var target = parseFloat(modal.querySelector("#g-target").value);
      if (!name || !(target >= 0)){ showToast("Bitte Name und Betrag prüfen."); return; }
      if (editing){ editing.name = name; editing.target = target; }
      else { state.goals.push({ id: uid("g"), name:name, target:target }); }
      saveState(); closeModal(); render();
      showToast(editing ? "Rücklage aktualisiert." : "Rücklage hinzugefügt.");
    });
  }

  function renderSections(){
    document.getElementById("view-root").innerHTML =
      '<div class="card" style="max-width:640px;">' +
        '<div class="card-title">Bereiche</div>' +
        '<p class="prose" style="margin-bottom:16px;">Bereiche gruppieren deine Buchungen (z. B. für Filter und Auswertungen). Du kannst sie frei benennen, umbenennen oder löschen.</p>' +
        (state.sections.length === 0 ? '<div class="empty-state">Noch keine Bereiche angelegt.</div>' : state.sections.map(function(s){
          var count = state.transactions.filter(function(t){ return t.section === s; }).length;
          return '<div class="goal-row">' +
            '<div><div class="goal-name">' + sectionPill(s) + "</div><div class=\"tx-meta\" style=\"margin-top:6px;\">" + count + " Buchung" + (count===1?"":"en") + "</div></div>" +
            '<div></div>' +
            '<div class="row-actions">' +
              '<button class="icon-btn" data-action="edit-section" data-name="' + escapeHtml(s) + '" title="Umbenennen">✎</button>' +
              '<button class="icon-btn" data-action="delete-section" data-name="' + escapeHtml(s) + '" title="Löschen">✕</button>' +
            "</div>" +
          "</div>";
        }).join("")) +
        '<div style="margin-top:16px;"><button class="btn-secondary" id="add-section-btn">+ Bereich hinzufügen</button></div>' +
      "</div>";

    document.getElementById("add-section-btn").addEventListener("click", function(){ openSectionForm(null); });
    document.querySelectorAll('[data-action="edit-section"]').forEach(function(btn){
      btn.addEventListener("click", function(){ openSectionForm(btn.dataset.name); });
    });
    document.querySelectorAll('[data-action="delete-section"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var name = btn.dataset.name;
        var count = state.transactions.filter(function(t){ return t.section === name; }).length;
        if (state.sections.length <= 1){
          confirmModal({ title: "Nicht möglich", message: "Es muss mindestens ein Bereich bestehen bleiben.", confirmLabel: "OK", onConfirm: function(){} });
          return;
        }
        if (count > 0){
          confirmModal({
            title: "Bereich wird noch verwendet",
            message: "„" + name + "“ wird noch von " + count + " Buchung" + (count===1?"":"en") + " verwendet. Bitte diese zuerst einem anderen Bereich zuordnen oder löschen.",
            confirmLabel: "OK",
            onConfirm: function(){}
          });
          return;
        }
        confirmModal({
          title: "Bereich löschen?",
          message: "„" + name + "“ wird entfernt.",
          danger: true,
          confirmLabel: "Löschen",
          onConfirm: function(){
            state.sections = state.sections.filter(function(s){ return s !== name; });
            delete state.categories[name];
            saveState(); render(); showToast("Bereich gelöscht.");
          }
        });
      });
    });
  }

  function openSectionForm(oldName){
    var html = "<h2>" + (oldName ? "Bereich umbenennen" : "Neuer Bereich") + "</h2>" +
      '<form id="section-form">' +
        '<div class="form-grid">' +
          '<div class="field full"><label for="s-name">Name</label><input type="text" id="s-name" value="' + (oldName ? escapeHtml(oldName) : "") + '" placeholder="z. B. Freizeit" required></div>' +
        "</div>" +
        '<div class="modal-actions"><button type="button" class="btn-secondary" data-close>Abbrechen</button><button type="submit" class="btn-primary">Speichern</button></div>' +
      "</form>";
    var modal = openModal(html, { small:true });
    modal.querySelector("[data-close]").addEventListener("click", closeModal);
    modal.querySelector("#section-form").addEventListener("submit", function(e){
      e.preventDefault();
      var name = modal.querySelector("#s-name").value.trim();
      if (!name){ showToast("Bitte einen Namen angeben."); return; }
      var duplicate = state.sections.some(function(s){ return s !== oldName && s.toLowerCase() === name.toLowerCase(); });
      if (duplicate){ showToast("Diesen Bereich gibt es schon."); return; }

      if (oldName){
        var idx = state.sections.indexOf(oldName);
        state.sections[idx] = name;
        state.transactions.forEach(function(t){ if (t.section === oldName) t.section = name; });
        state.categories[name] = state.categories[oldName] || [];
        if (name !== oldName) delete state.categories[oldName];
      } else {
        state.sections.push(name);
        state.categories[name] = [];
      }
      saveState(); closeModal(); render();
      showToast(oldName ? "Bereich umbenannt." : "Bereich hinzugefügt.");
    });
  }

  function renderAnalysis(){
    var buckets = monthlyBuckets();
    var scope = ui.analysis.scope, type = ui.analysis.type;
    var scopeOptions = '<option value="all">Gesamter Zeitraum</option>' + buckets.slice().reverse().map(function(b){
      return '<option value="' + b.bucket + '"' + (scope === b.bucket ? " selected" : "") + ">" + bucketLabel(b.bucket) + "</option>";
    }).join("");
    var items = categoryBreakdown(scope, type);
    var total = items.reduce(function(s,i){ return s + i.amount; }, 0);

    document.getElementById("view-root").innerHTML =
      '<div class="section-gap">' +
        '<div class="card">' +
          '<div class="card-title">Einnahmen &amp; Ausgaben pro Monat</div>' +
          renderMonthlyBarChart(buckets) +
        "</div>" +
        '<div class="card">' +
          '<div class="card-title">Kategorien im Detail</div>' +
          '<div class="toolbar">' +
            '<select class="field-select" id="an-scope">' + scopeOptions + "</select>" +
            '<div class="segmented" id="an-type">' +
              '<button data-value="expense" class="' + (type==="expense"?"active":"") + '">Ausgaben</button>' +
              '<button data-value="income" class="' + (type==="income"?"active":"") + '">Einnahmen</button>' +
            "</div>" +
            '<span style="margin-left:auto;color:var(--ink-faint);font-size:12.5px;">Summe: <span class="num">' + fmtEUR(total) + "</span></span>" +
          "</div>" +
          renderBarsList(items) +
        "</div>" +
      "</div>";

    document.getElementById("an-scope").addEventListener("change", function(e){ ui.analysis.scope = e.target.value; renderAnalysis(); });
    document.querySelectorAll("#an-type button").forEach(function(btn){
      btn.addEventListener("click", function(){ ui.analysis.type = btn.dataset.value; renderAnalysis(); });
    });
  }

  function renderData(){
    document.getElementById("view-root").innerHTML =
      '<div class="section-gap" style="max-width:640px;">' +
        '<div class="card">' +
          '<div class="card-title">Über deine Daten</div>' +
          '<p class="prose">Alle Buchungen, Rücklagen und Einstellungen liegen ausschließlich lokal im Speicher dieses Browsers – nichts wird an einen Server gesendet. Das heißt aber auch: Ein anderes Gerät, ein anderer Browser oder gelöschte Browserdaten sehen diesen Stand nicht. Nutze die Sicherung unten regelmäßig, um Buchungen aufzuheben.</p>' +
        "</div>" +
        '<div class="card">' +
          '<div class="card-title">Sicherung</div>' +
          '<p class="prose">Kopiert alle aktuellen Daten als JSON in die Zwischenablage – zum Aufheben oder Übertragen auf ein anderes Gerät.</p>' +
          '<button class="btn-secondary" id="export-btn">In Zwischenablage kopieren</button>' +
        "</div>" +
        '<div class="card">' +
          '<div class="card-title">Wiederherstellen</div>' +
          '<p class="prose">Zuvor kopierte JSON-Daten hier einfügen und wiederherstellen. Ersetzt den aktuellen Stand in diesem Browser.</p>' +
          '<textarea class="code-block" id="import-text" placeholder="JSON hier einfügen…"></textarea>' +
          '<div style="margin-top:10px;"><button class="btn-secondary" id="import-btn">Wiederherstellen</button></div>' +
        "</div>" +
        '<div class="card danger-zone">' +
          '<div class="card-title">Zurücksetzen</div>' +
          '<p class="prose">Setzt alle Buchungen und Rücklagen auf 0 zurück (die Standard-Bereiche bleiben erhalten), oder löscht wirklich alles inklusive der Bereiche.</p>' +
          '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
            '<button class="btn-secondary" id="reset-seed-btn">Auf 0 zurücksetzen</button>' +
            '<button class="btn-danger" id="clear-all-btn">Alle Daten löschen</button>' +
          "</div>" +
        "</div>" +
      "</div>";

    document.getElementById("export-btn").addEventListener("click", function(){
      var json = JSON.stringify(state, null, 2);
      copyToClipboard(json);
    });
    document.getElementById("import-btn").addEventListener("click", function(){
      var raw = document.getElementById("import-text").value.trim();
      if (!raw){ showToast("Bitte zuerst JSON einfügen."); return; }
      try {
        var parsed = JSON.parse(raw);
        if (!parsed.transactions || !parsed.openingBalance || !parsed.goals || !parsed.categories) throw new Error("shape");
        if (!parsed.sections) parsed.sections = DEFAULT_SECTIONS.slice();
        confirmModal({
          title: "Daten wiederherstellen?",
          message: "Der aktuelle Stand in diesem Browser wird durch die eingefügten Daten ersetzt.",
          confirmLabel: "Wiederherstellen",
          onConfirm: function(){
            state = parsed;
            saveState();
            render();
            showToast("Daten wiederhergestellt.");
          }
        });
      } catch(e){
        showToast("Das eingefügte JSON konnte nicht gelesen werden.");
      }
    });
    document.getElementById("reset-seed-btn").addEventListener("click", function(){
      confirmModal({
        title: "Auf 0 zurücksetzen?",
        message: "Alle Buchungen und Rücklagen werden gelöscht und der Kontostand auf 0 gesetzt. Die Standard-Bereiche bleiben erhalten.",
        danger: true,
        confirmLabel: "Zurücksetzen",
        onConfirm: function(){
          state = clone(SEED);
          saveState(); render();
          showToast("Auf 0 zurückgesetzt.");
        }
      });
    });
    document.getElementById("clear-all-btn").addEventListener("click", function(){
      confirmModal({
        title: "Wirklich alles löschen?",
        message: "Alle Buchungen, Rücklagen und Bereiche werden unwiderruflich gelöscht.",
        danger: true,
        confirmLabel: "Alles löschen",
        onConfirm: function(){
          state = {
            openingBalance: { amount: 0, date: todayIso() },
            transactions: [],
            goals: [],
            sections: [],
            categories: {}
          };
          saveState(); render();
          showToast("Alle Daten gelöscht.");
        }
      });
    });
  }

  function copyToClipboard(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        showToast("In Zwischenablage kopiert.");
      }).catch(function(){ fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); showToast("In Zwischenablage kopiert."); }
    catch(e){ showToast("Kopieren nicht möglich – bitte manuell auswählen."); }
    document.body.removeChild(ta);
  }

  /* ---------- Router / render ---------- */
  var VIEW_TITLES = { dashboard:"Übersicht", transactions:"Buchungen", goals:"Rücklagen", sections:"Bereiche", analysis:"Auswertung", data:"Daten" };
  var VIEW_RENDERERS = { dashboard:renderDashboard, transactions:renderTransactions, goals:renderGoals, sections:renderSections, analysis:renderAnalysis, data:renderData };

  function render(){
    document.getElementById("view-title").textContent = VIEW_TITLES[ui.view];
    document.querySelectorAll(".nav-item").forEach(function(btn){
      btn.classList.toggle("active", btn.dataset.view === ui.view);
    });
    VIEW_RENDERERS[ui.view]();
  }

  document.getElementById("nav").addEventListener("click", function(e){
    var btn = e.target.closest("[data-view]");
    if (!btn) return;
    ui.view = btn.dataset.view;
    render();
  });
  document.getElementById("add-tx-btn").addEventListener("click", function(){ openTxForm(null); });

  var themeToggle = document.getElementById("theme-toggle");
  function applyStoredTheme(){
    try {
      var stored = localStorage.getItem("finanzpilot.theme");
      if (stored === "light" || stored === "dark") document.documentElement.setAttribute("data-theme", stored);
    } catch(e){}
  }
  themeToggle.addEventListener("click", function(){
    var current = document.documentElement.getAttribute("data-theme");
    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var effectiveDark = current === "dark" || (!current && prefersDark);
    var next = effectiveDark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("finanzpilot.theme", next); } catch(e){}
  });
  applyStoredTheme();

  render();
})();
</script>
